<div class="travel-card" [routerLink]="['voyage', travel.id]" routerLinkActive="active">
    <div class="info">
        <h2>{{ travel.destination }}</h2>
        <p>{{ travel.description.slice(0,20) }}</p>
        <p>{{ travel.prix }} €</p>
        <app-bouton-supprimer 
            [travel]="travel" 
            [supprimerTravel]="supprimerTravel"
            (click)="stopPropagation($event)">
        </app-bouton-supprimer>
    </div>
    <img [src]="travel.representation" [alt]="travel.destination">
</div>
